name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-cs:
    runs-on: ubuntu-latest
    name: php-cs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up php
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install dependencies
        run: composer i
        working-directory: .

      - name: Lint
        run: composer run cs:check || ( echo 'Please run `composer run cs:fix` to format your code' && exit 1 )
        working-directory: .

  js-lint:
    runs-on: ubuntu-latest
    name: js-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: ESLint
        run: npm run lint || ( echo 'Please run `npm run lint:fix` to fix lint errors' && exit 1 )
        working-directory: .

      - name: Stylelint
        run: npm run stylelint || ( echo 'Please run `npm run stylelint:fix` to fix style errors' && exit 1 )
        working-directory: .
